# =====================================================================
#  OMS-XDR — Base de règles pilotée par données  (INTÉGRÉE au SIEM OMNITECH)
#  signals  : requêtes atomiques exécutées contre Graylog
#  rules    : corrélation multi-signaux par entité + mapping MITRE ATT&CK
#
#  INTÉGRATION (18/06/2026) : les signaux consomment les DÉTECTIONS EXISTANTES
#  (champ `alert_tag` + schéma normalisé `event_id`/`src_ip`/`user`/`host`/
#  `event_action`) plutôt que de re-détecter sur des champs bruts. oms-xdr est
#  ainsi la couche CORRÉLATION + LLM + RÉPONSE au-dessus du moteur de détection
#  mûr d'OMNITECH, sans doublon.  Clés de stream -> IDs réels dans config.yaml.
#  NB: valider les noms de champs FortiGate (subtype/status) au 1er run --once.
# =====================================================================

# ---- SESSIONS (pont cross-entité) ----------------------------------
# Carte user<->host construite depuis les logons réussis (4624) pour corréler un
# COMPTE à risque (signal user-keyed) avec une DÉTECTION sur SON poste (host-keyed).
# Utilisée par les règles `bridge: user_host`. host_field/user_field = champs normalisés.
sessions:
  user_host:
    stream: windows
    query: 'event_id:4624 AND NOT account_class:machine AND NOT account_class:service'
    user_field: user
    host_field: host
    window: 480   # 8h : capture les sessions de logon actives (vs fenêtre détections 5min)

# ---- SIGNAUX -------------------------------------------------------
# type: count_by  -> agrège par entity_field et déclenche si count >= threshold
# type: presence  -> déclenche si >=1 message (l'alert_tag a déjà appliqué le seuil de détection)
signals:

  S_PORTSCAN_FW:
    description: "Scan réseau détecté (FortiGate IPS / détection interne T1046)"
    stream: fortigate
    query: 'alert_tag:network_scan'
    type: presence
    entity_field: src_ip

  S_PORTSCAN_NET:
    description: "Delta de ports ouverts détecté par oms-netscan"
    stream: netscan
    query: 'oms_event:"new_open_port"'
    type: presence
    entity_field: target_host

  S_BRUTEFORCE_WIN:
    description: "Échecs d'authentification Windows répétés (4625, hors compte de service)"
    stream: windows
    query: 'event_id:4625 AND logon_fail:1 AND NOT account_class:machine AND NOT account_class:service'
    type: count_by
    # identity = compte canonique (minuscule, domaine/UPN normalisés) : join fiable
    # avec S_LOGON_SUCCESS. Peuplé à 100% sur les logons humains (verifie 08/07).
    entity_field: identity
    threshold: 10

  S_BRUTEFORCE_VPN:
    description: "Échecs d'authentification VPN/SSL-VPN FortiGate"
    stream: fortigate
    query: 'subtype:"vpn" AND action:"ssl-login-fail"'
    type: count_by
    # audit A.1 REPORTE : src_ip est vide sur les logs VPN Forti (remip = IP reelle du client), MAIS
    # basculer ici seul casse la jointure de CR_RECON_TO_ACCESS (partenaire sur src_ip) -> a traiter
    # avec l'alignement du partenaire, decision RSSI. Rayon operationnel actuel = 0 (0 incident).
    entity_field: src_ip
    threshold: 8

  S_LOGON_SUCCESS:
    description: "Connexion réussie (4624) — corrélée à un brute force / sign-in M365"
    stream: windows
    query: 'event_id:4624 AND NOT account_class:machine AND NOT account_class:service'
    type: presence
    # identity (canonique) plutôt que user brut : corrige les ratés de join dus à la
    # casse / au domaine / à l'UPN entre M365 et on-prem. 100% peuplé sur humains.
    entity_field: identity

  S_LOGON_SUCCESS_IP:
    description: "Connexion réussie (4624) indexée par IP source — pour corréler un spray (IP) à un succès depuis la MÊME IP"
    stream: windows
    query: 'event_id:4624 AND _exists_:src_ip AND NOT account_class:machine AND NOT account_class:service'
    type: presence
    entity_field: src_ip

  S_NEW_ADMIN:
    description: "Ajout à un groupe privilégié (détection local_admin_add / 4728-4732-4756)"
    stream: windows
    query: 'alert_tag:local_admin_add OR event_id:(4728 OR 4732 OR 4756)'
    type: presence
    entity_field: user

  S_USER_CREATED:
    description: "Création de compte (détection local_account_create / 4720)"
    stream: windows
    query: 'alert_tag:local_account_create OR event_id:4720'
    type: presence
    entity_field: user

  S_KERBEROAST:
    description: "Kerberoasting (détection existante alert_tag:kerberoasting)"
    stream: windows
    query: 'alert_tag:kerberoasting OR alert_tag:kerberos_rc4'
    type: presence
    entity_field: user

  S_DCSYNC:
    description: "DCSync (détection existante alert_tag:dcsync)"
    stream: windows
    query: 'alert_tag:dcsync'
    type: presence
    entity_field: user

  S_PSSCRIPTBLOCK:
    description: "PowerShell offensif (détection existante alert_tag:powershell_suspect)"
    stream: windows
    query: 'alert_tag:powershell_suspect'
    type: presence
    entity_field: host

  S_OUTBOUND_DENY_SPIKE:
    description: "Pic de flux sortants bloqués / exfiltration (C2 potentiel)"
    stream: fortigate
    query: 'action:"deny" AND (alert_tag:data_exfil OR net_direction:"sortant")'
    type: count_by
    entity_field: src_ip
    threshold: 50

  # --- Signaux consommant des détections critiques existantes (stream vide = tous) ---
  S_LSASS:
    description: "Accès mémoire LSASS (vol d'identifiants — détection existante)"
    stream: ""
    query: 'alert_tag:lsass_access'
    type: presence
    entity_field: host

  S_RANSOMWARE:
    description: "Indicateur rançongiciel (effacement clichés/sauvegardes)"
    stream: ""
    query: 'alert_tag:ransomware_indicator'
    type: presence
    entity_field: host

  S_AUDIT_TAMPER:
    description: "Sabotage de la journalisation / audit Windows"
    stream: ""
    query: 'alert_tag:winsec_critique'
    type: presence
    entity_field: host

  S_DEFENSE_OFF:
    description: "Neutralisation des défenses (Defender / arrêt service sécurité)"
    stream: ""
    query: 'alert_tag:defender OR alert_tag:service_stop_securite'
    type: presence
    entity_field: host

  S_ADCS_ABUSE:
    description: "Abus AD CS / certificats (ESC1-ESC8)"
    stream: ""
    query: 'alert_tag:adcs_abuse'
    type: presence
    entity_field: user

  S_SHADOW_CREDS:
    description: "Shadow Credentials (msDS-KeyCredentialLink)"
    stream: ""
    query: 'alert_tag:shadow_credentials'
    type: presence
    entity_field: user

  # --- Nouvelles détections DC (07/2026) : tripwires haute-fidélité (volume ~0) ---
  # entity_field: host (le DC source, toujours peuplé) — ces signaux alimentent des
  # règles join_entity:false, l'entité ne sert qu'au reporting/dédup.
  S_RBCD:
    description: "RBCD : délégation contrainte basée ressource ajoutée (msDS-AllowedToActOnBehalfOfOtherIdentity)"
    stream: ""
    query: 'alert_tag:rbcd_delegation'
    type: presence
    entity_field: host
  S_SPN_USER:
    description: "SPN ajouté à un compte utilisateur (préparation kerberoast ciblé)"
    stream: ""
    query: 'alert_tag:spn_added_user'
    type: presence
    entity_field: host
  S_ADMINSDHOLDER:
    description: "ACL AdminSDHolder modifiée (persistance Tier-0)"
    stream: ""
    query: 'alert_tag:adminsdholder_acl'
    type: presence
    entity_field: host
  S_ZEROLOGON:
    description: "Zerologon suspecté : 4742 (changement mot de passe machine) par ANONYMOUS LOGON"
    stream: ""
    query: 'alert_tag:zerologon_suspect'
    type: presence
    entity_field: host

  S_LATERAL:
    description: "Mouvement latéral (compte -> N hôtes / WMI)"
    stream: ""
    query: 'alert_tag:lateral_movement OR alert_tag:wmi_lateral_exec'
    type: presence
    entity_field: user

  S_EXPOSITION:
    description: "Service interne exposé sur Internet"
    stream: fortigate
    query: 'alert_tag:exposition_internet'
    type: presence
    entity_field: dest_ip

  # --- Kill-chains additives (AXE C) : feuilles persistance / cred-use / lateral ---
  S_PERSIST_SERVICE:
    description: "Installation de service Windows (4697 / service_install — T1543.003)"
    stream: ""
    query: 'alert_tag:service_install'
    type: presence
    entity_field: host
  S_PERSIST_TASK:
    description: "Tâche planifiée créée (4698 / scheduled_task — T1053.005)"
    stream: ""
    query: 'alert_tag:scheduled_task'
    type: presence
    entity_field: host
  S_PERSIST_AUTORUN:
    description: "Persistance par autorun (Sysmon 13 / persistence_autorun — T1547.001)"
    stream: ""
    query: 'alert_tag:persistence_autorun'
    type: presence
    entity_field: host
  S_EXPLICIT_CRED:
    description: "Usage d'identifiants explicites / RunAs (4648 — T1078)"
    stream: ""
    query: 'alert_tag:explicit_cred_use'
    type: presence
    entity_field: host
  S_ADMINSHARE:
    description: "Accès à un partage administratif C$/ADMIN$ (5140 / admin_share — T1021.002)"
    stream: ""
    query: 'alert_tag:admin_share'
    type: presence
    entity_field: host
  S_LSASS_6H:
    description: "Accès mémoire LSASS — fenêtre 6h pour corrélation latérale lente (T1003.001)"
    stream: ""
    query: 'alert_tag:lsass_access'
    type: presence
    entity_field: host
    window: 360

  # --- Déception (OMNI Sentinel Pilier 1) : signaux à fidélité ~100% ---
  S_DECOY_IDENTITY:
    description: "Leurre d'identité touché (honeytoken compte/machine)"
    stream: windows
    query: 'alert_tag:decoy_identity'
    type: presence
    entity_field: user

  S_DECOY_KERBEROAST:
    description: "Leurre Kerberoast touché (TGS sur SPN leurre)"
    stream: windows
    query: 'alert_tag:decoy_kerberoast'
    type: presence
    entity_field: user

  S_CANARY:
    description: "Token canari déclenché (fichier appât ouvert)"
    stream: sysmon
    query: 'alert_tag:canary_token'
    type: presence
    entity_field: host

  # --- FortiClient EMS (télémétrie endpoint) ---
  S_FORTICLIENT_MALWARE:
    description: "Malware détecté par l'AV FortiClient sur un poste"
    stream: ""
    query: 'alert_tag:forticlient_malware'
    type: presence
    entity_field: host

  S_FORTICLIENT_AVOFF:
    description: "Protection FortiClient désactivée / altérée sur un poste"
    stream: ""
    query: 'alert_tag:forticlient_av_off'
    type: presence
    entity_field: host

  # --- Corrélation cross-source par src_ip / user (chasse du 23/06) ---
  # Spray = 1 IP -> N COMPTES DISTINCTS en échec (distinct_by). Discriminant validé
  # sur données réelles : la rotation de mot de passe d'un user (adaguerre/xavier.labarbe/
  # gbertiner depuis leur poste) échoue sur 1 SEUL compte -> exclue. Un vrai spray cible
  # plusieurs comptes -> seuil >=5 comptes distincts.
  S_SPRAY_WIN:
    description: "Spray AD : une IP source échoue sur >=5 comptes DISTINCTS (4625/4771, hors machine/service)"
    stream: windows
    query: 'event_id:(4625 OR 4771) AND NOT account_class:machine AND NOT account_class:service'
    type: distinct_by
    entity_field: src_ip
    distinct_field: user
    threshold: 5

  S_M365_FOREIGN_SIGNIN:
    description: "Sign-in M365 RÉUSSI (status_code:0) depuis un pays hors egress O365 (FR/CA/US/SE/NL/IE/DE/GB exclus). status_code:0 OBLIGATOIRE : les signins étrangers échoués (~tous) sont du credential-stuffing botnet, pas un voyage impossible."
    stream: m365
    query: 'event_source:m365 AND status_code:0 AND _exists_:src_ip_country_code AND NOT src_ip_country_code:(FR OR CA OR US OR SE OR NL OR IE OR DE OR GB) AND NOT user:no\-reply'
    type: count_by
    # identity (dérivée de l'UPN côté M365) : join fiable avec S_LOGON_SUCCESS on-prem.
    entity_field: identity
    threshold: 1

  S_M365_DISTRIBUTED_ATTACK:
    description: "Compte M365 ciblé par credential-stuffing distribué : échecs depuis >=3 PAYS distincts (botnet). Failing mais permet de prioriser MFA/reset sur les comptes ciblés."
    stream: m365
    query: 'event_source:m365 AND event_action:echec_connexion AND _exists_:src_ip_country_code AND NOT src_ip_country_code:(FR OR CA OR US OR SE OR NL OR IE OR DE OR GB)'
    type: distinct_by
    entity_field: user
    distinct_field: src_ip_country_code
    threshold: 3
    window: 1440

  S_UEBA_HIGH_USER:
    description: "Utilisateur à risque UEBA élevé (score >= 80) — entité user (fix user-keyed 23/06)"
    stream: internal
    query: 'event_source:ueba_score AND entity_type:user AND ueba_score:>=80'
    type: presence
    entity_field: user

  S_PRIV_ACTION_USER:
    description: "Action privilégiée/sensible attribuée à un user (cloud, AD, réseau, DNS)"
    stream: ""
    query: 'alert_tag:(m365_role OR m365_app_credential_add OR m365_ca_change OR local_admin_add OR local_account_create OR dns_sensitive_change OR aruba_config_change OR ems_config_change)'
    type: presence
    entity_field: user

  # --- Anomalie comportementale ML (oms-ml / IsolationForest) : feuille de CONFIRMATION ---
  # Seule, une anomalie ML n'est PAS actionnable (~3150/7j). Sa valeur = CORROBORER une
  # détection sur la même entité (cf. CR_ANOMALY_CONFIRMED_*). entity_field=entity (=hostname
  # pour host, =compte pour account, posé par oms-ml).
  S_ML_ANOMALY_HOST:
    description: "Anomalie comportementale ML élevée sur un hôte (score >= 80)"
    stream: internal
    query: 'event_source:ml_anomaly AND entity_type:host AND ml_score:>=80'
    type: presence
    entity_field: entity
  S_ML_ANOMALY_USER:
    description: "Anomalie comportementale ML élevée sur un compte (score >= 80)"
    stream: internal
    query: 'event_source:ml_anomaly AND entity_type:account AND ml_score:>=80'
    type: presence
    entity_field: entity

  # --- SEAL (surete physique : acces badge, alarmes, audit hyperviseur) -------
  # Tripwires haute-fidelite calibres sur donnees reelles (QA). event_domain +
  # seal_source_table normalises par les pipelines SEAL. Entites : actor_usercode/
  # actor_login (operateur console) ou target_object_label (objet/porte/zone).
  S_SEAL_MASTERKEY:
    description: "SEAL : attribution d'un passe general (master key) sur un badge (T1098 physique)"
    stream: seal_audit
    query: 'event_domain:hypervisor_audit AND seal_source_table:TagMovements AND seal_MasterKeys:true'
    type: presence
    entity_field: actor_usercode
  S_SEAL_ALARM_INHIBIT:
    description: "SEAL : inhibition d'une alarme (precurseur insider, neutralisation detection physique)"
    stream: seal_alarm
    query: 'event_domain:alarm AND IS_INHIBITED:true'
    type: presence
    entity_field: target_object_label
  S_SEAL_CONSOLE_BRUTE:
    description: "SEAL : echecs repetes de connexion a la console hyperviseur (meme compte)"
    stream: seal_audit
    query: 'event_domain:hypervisor_audit AND event_action:ConnectionFailure'
    type: count_by
    entity_field: actor_login
    threshold: 5
  S_SEAL_ACCOUNT_CHANGE:
    description: "SEAL : mouvement de compte/role operateur (creation, elevation, deverrouillage)"
    stream: seal_audit
    query: 'event_domain:hypervisor_audit AND seal_source_table:(AccountsMovements OR AccountRolesMovements OR ProfileRoleMovements)'
    type: presence
    entity_field: actor_usercode
  S_SEAL_DOOR_DENY_BURST:
    description: "SEAL : rafale de refus d'acces sur une meme porte (forcage/probing badge)"
    stream: seal_access
    query: 'event_domain:access AND event_outcome:deny'
    type: count_by
    entity_field: target_object_label
    threshold: 8
  S_SEAL_ADMIN_OFFHOURS:
    description: "SEAL : connexion a la console d'administration hors heures ouvrees"
    stream: seal_audit
    query: 'event_domain:hypervisor_audit AND event_action:Connection AND operation_channel:SealAdmin AND off_hours:true'
    type: presence
    entity_field: actor_usercode

  # --- XCO : signaux du pont d'identite SEAL x AD/Windows (keye identity_upn) ---
  # entity_field: identity_upn = forme canonique (UPN minuscule) IDENTIQUE au champ
  # `identity` cote Windows/M365 -> le join se fait sur la MEME valeur d'entite.
  # PRE-REQUIS : identity_upn peuple par la lookup omni-seal-identity (matricule->UPN,
  # regen-seal-identity.sh) + regle 14-seal-identity-upn.rule. Tant que le pont n'est
  # pas cable, ces signaux renvoient un ensemble VIDE (identity_upn absent) et les
  # regles XCO ne se declenchent pas (cf docs/CORRELATION-SEAL-AD.md).
  S_SEAL_BADGE_IN:
    description: "SEAL : badge-in accorde (presence physique averee sur un site), keye par UPN resolu"
    stream: seal_access
    query: 'event_domain:access AND event_outcome:grant AND _exists_:identity_upn'
    type: presence
    entity_field: identity_upn
  S_SEAL_CONSOLE_LOGON:
    description: "SEAL : connexion a la console hyperviseur (operateur), keye par UPN resolu"
    stream: seal_audit
    query: 'event_domain:hypervisor_audit AND event_action:Connection AND _exists_:identity_upn'
    type: presence
    entity_field: identity_upn

  # --- Pont CONSOLE (FIABLE) : actor_login normalise en identity_console (login AD
  # minuscule) = MEME forme canonique que `identity` cote Windows/M365. Contrairement
  # au pont badge (identity_upn, quasi vide car matricule = champ libre), celui-ci
  # JOINT reellement : retevenard/pgelard/jmorin... ont des logons Windows sur
  # identity:<login> (verifie 15/07). Cle de correlation console x AD exploitable.
  S_SEAL_CONSOLE_ID:
    description: "SEAL : connexion console keyee par le compte AD normalise (identity_console)"
    stream: seal_audit
    query: 'event_domain:hypervisor_audit AND event_action:Connection AND _exists_:identity_console AND NOT _exists_:TEST_SIEM'
    type: presence
    entity_field: identity_console

# ---- RÈGLES DE CORRÉLATION ----------------------------------------
# require_all : tous les signaux présents pour la MÊME entité dans la fenêtre
# any_of      : au moins un des signaux listés
# join_entity : true => corrélation par entité commune ; false => corrélation globale
rules:

  CR_PASSWORD_SPRAY_INTERNAL:
    title: "Password spray interne : une IP échoue sur >=5 comptes AD distincts"
    severity: high
    join_entity: true
    require_all: [S_SPRAY_WIN]
    mitre: ["T1110", "T1110.003"]
    tactic: ["Credential Access"]

  CR_IMPOSSIBLE_TRAVEL_PIVOT:
    title: "Voyage impossible : sign-in M365 étranger + logon on-prem (même utilisateur)"
    severity: critical
    join_entity: true
    require_all: [S_M365_FOREIGN_SIGNIN, S_LOGON_SUCCESS]
    mitre: ["T1078", "T1078.004"]
    tactic: ["Initial Access", "Defense Evasion"]

  CR_M365_ACCOUNT_TARGETED:
    title: "Compte M365 sous attaque distribuée (credential-stuffing >=3 pays) — prioriser MFA/reset"
    severity: medium
    join_entity: false
    any_of: [S_M365_DISTRIBUTED_ATTACK]
    mitre: ["T1110.004", "T1110.003"]
    tactic: ["Credential Access"]

  CR_RISKY_USER_PRIV_ACTION:
    title: "Utilisateur à risque UEBA réalisant une action privilégiée (débloqué par le fix user-keyed)"
    severity: high
    join_entity: true
    require_all: [S_UEBA_HIGH_USER, S_PRIV_ACTION_USER]
    mitre: ["T1078", "T1098"]
    tactic: ["Privilege Escalation", "Persistence"]

  CR_RECON_TO_ACCESS:
    title: "Reconnaissance suivie d'attaque par force brute"
    severity: high
    join_entity: true
    require_all: [S_BRUTEFORCE_VPN]
    any_of: [S_PORTSCAN_FW, S_PORTSCAN_NET]
    mitre: ["T1046", "T1110"]
    tactic: ["Reconnaissance", "Credential Access"]

  CR_CRED_ABUSE:
    title: "Force brute aboutie + connexion réussie (compromission probable)"
    severity: high
    join_entity: true
    require_all: [S_BRUTEFORCE_WIN, S_LOGON_SUCCESS]
    mitre: ["T1110", "T1078"]
    tactic: ["Credential Access", "Defense Evasion"]

  CR_PRIV_ESCALATION:
    title: "Création de compte / élévation de privilèges hors changement validé"
    severity: high
    join_entity: false
    any_of: [S_NEW_ADMIN, S_USER_CREATED]
    mitre: ["T1136", "T1098", "T1078.002"]
    tactic: ["Persistence", "Privilege Escalation"]

  CR_AD_CREDENTIAL_THEFT:
    title: "Vol d'identifiants Active Directory (Kerberoasting / DCSync / SPN ciblé)"
    severity: critical
    join_entity: false
    any_of: [S_KERBEROAST, S_DCSYNC, S_SPN_USER]
    mitre: ["T1558.003", "T1003.006"]
    tactic: ["Credential Access"]

  # NB honnêteté : S_PSSCRIPTBLOCK est keyé host, S_OUTBOUND_DENY_SPIKE keyé src_ip
  # (espaces de nommage disjoints) -> ceci est une CO-OCCURRENCE temporelle globale,
  # PAS un join même-hôte confirmé. Donc severity=high (à confirmer par l'analyste),
  # pas critical : le critique reste réservé aux kill-chains à join réel (cf. design).
  CR_EXECUTION_C2:
    title: "PowerShell offensif ET pic de flux sortants dans la fenêtre (C2 possible — co-occurrence à confirmer)"
    severity: high
    # audit F.2 : join_entity false + espaces de nommage disjoints (host vs src_ip) faisait tirer
    # ~19 incidents high/j via le churn de S_OUTBOUND_DENY_SPIKE (1,16 M docs/j) si S_PSSCRIPTBLOCK
    # etait ranime. Passe a true -> exige une entite commune (absente aujourd'hui) : inerte et honnete,
    # neutralise le flood. NE PAS ranimer S_PSSCRIPTBLOCK (F.1) sans donner ici un vrai join meme-hote.
    join_entity: true
    require_all: [S_PSSCRIPTBLOCK]
    any_of: [S_OUTBOUND_DENY_SPIKE]
    mitre: ["T1059.001", "T1071"]
    tactic: ["Execution", "Command and Control"]

  CR_LATERAL_FROM_SCAN:
    title: "Scan interne depuis un hôte du parc (mouvement latéral)"
    severity: medium
    join_entity: true
    require_all: [S_PORTSCAN_NET]
    mitre: ["T1046", "T1021"]
    tactic: ["Discovery", "Lateral Movement"]

  # Mono-signal = simple re-label d'une détection FP-prone -> PAS critique (sinon
  # faux-critiques). Le CRITIQUE est réservé aux kill-chains >=2 signaux
  # (CR_CREDDUMP_PERSIST / CR_CREDDUMP_LATERAL escaladent LSASS+persistance/latéral).
  CR_LSASS_THEFT:
    title: "Accès mémoire LSASS isolé (à corréler — vol d'identifiants potentiel)"
    severity: medium
    join_entity: false
    any_of: [S_LSASS]
    mitre: ["T1003.001"]
    tactic: ["Credential Access"]

  CR_DECEPTION_TRIGGERED:
    title: "Leurre de déception déclenché — compromission quasi-certaine"
    severity: critical
    join_entity: false
    any_of: [S_DECOY_IDENTITY, S_DECOY_KERBEROAST, S_CANARY]
    mitre: ["T1078", "T1558.003", "T1005"]
    tactic: ["Credential Access", "Collection"]

  CR_ENDPOINT_MALWARE:
