    tactic: ["Defense Evasion", "Persistence"]

  # ============ XCO — correlation croisee SEAL (physique) x AD/Windows =========
  # Objectif (mission §7 XCO-001/002/003) : joindre un evenement physique SEAL au
  # logon logique Windows/M365 de la MEME personne, via le pont d'identite
  # identity_upn (badge -> matricule -> UPN, lookup omni-seal-identity + regle 14).
  #
  # ACTIVATION CONDITIONNELLE (honnetete) : ces regles ne se declenchent QUE
  # lorsque identity_upn est peuple des DEUX cotes (SEAL via le lookup ; Windows/
  # M365 via 13-identity-mirror). Aujourd'hui identity_matricule est tres peu
  # peuple (~35 events) et identity_upn=0 -> les signaux XCO renvoient un ensemble
  # vide et AUCUN incident XCO ne sort tant que le pont n'est pas alimente. Le join
  # se fait sur la valeur d'entite (UPN canonique minuscule), commune a identity_upn
  # (SEAL) et identity (Windows/M365). Cf docs/CORRELATION-SEAL-AD.md.

  CR_XCO_IMPOSSIBLE_PRESENCE:
    title: "XCO : presence impossible — badge-in physique SEAL + sign-in M365 etranger (meme identite)"
    severity: critical
    join_entity: true
    require_all: [S_SEAL_BADGE_IN, S_M365_FOREIGN_SIGNIN]
    mitre: ["T1078", "T1078.004"]
    tactic: ["Initial Access", "Defense Evasion"]

  # CR_XCO_CONSOLE_NO_BADGE : connexion a la console hyperviseur (zone securisee)
  # SANS badge-in physique du meme identity_upn. LIMITE MOTEUR : la correlation ne
  # sait pas exprimer une ABSENCE (pas d'anti-join). On approche donc l'intention en
  # joignant la connexion console (S_SEAL_CONSOLE_LOGON) au logon Windows du meme
  # identity_upn (S_LOGON_SUCCESS) : cela materialise une session console rattachee a
  # une identite AD. Le controle "sans badge-in" reste a la charge de l'analyste (ou
  # d'un futur enrichissement badged_in_today / anti-join). D'ou severity=high (a
  # confirmer), pas critical. Ne sort que si identity_upn est peuple cote SEAL.
  CR_XCO_CONSOLE_NO_BADGE:
    title: "XCO : connexion console hyperviseur rattachee a une identite AD — badge physique a verifier"
    severity: high
    join_entity: true
    require_all: [S_SEAL_CONSOLE_LOGON, S_LOGON_SUCCESS]
    mitre: ["T1078", "T1219"]
    tactic: ["Lateral Movement", "Defense Evasion"]
