# Adresse cliente réelle derrière le proxy FortiGate 10.33.70.1 (23/11/2026).
# Le FortiGate ajoute l'adresse du client dans X-Forwarded-For. Seul 10.33.70.1 est
# de confiance : avec real_ip_recursive, nginx retient la dernière adresse de la chaîne
# qui n'est pas de confiance, c'est-à-dire celle ajoutée par le FortiGate ; une valeur
# forgée par le client, placée avant, est ignorée. $remote_addr (journaux, limites de
# débit, X-Real-IP transmis à la console) devient l'adresse réelle du poste.
set_real_ip_from 10.33.70.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
