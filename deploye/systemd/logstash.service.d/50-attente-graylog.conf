# Démarrage de Logstash après l'input GELF TCP 12202 de Graylog (collecte SEAL).
# Cause corrigée (journal du 17/11/2026, 15:20) : au démarrage de la machine, la sortie
# gelf de seal.conf se connecte à 127.0.0.1:12202 avant que Graylog n'écoute
# (Errno::ECONNREFUSED) ; le pipeline main échoue, Logstash s'arrête et systemd le
# relance (4 fois, NRestarts=4) jusqu'à l'ouverture de l'input.
# Ici : ordre après graylog-server, puis attente bornée (300 s) du port ; à l'échéance,
# Logstash démarre quand même et Restart=always (paquet) reste le filet.
# Aucun message n'est envoyé : la connexion de test est ouverte puis refermée.
# Effet au prochain démarrage de Logstash ; retour arrière : supprimer ce fichier,
# systemctl daemon-reload.
[Unit]
After=graylog-server.service
[Service]
ExecStartPre=/bin/bash -c 'i=0; while [ $$i -lt 60 ]; do (exec 3<>/dev/tcp/127.0.0.1/12202) 2>/dev/null && exit 0; sleep 5; i=$$((i+1)); done; echo "input GELF TCP 12202 injoignable apres 300 s, demarrage sans attendre davantage"; exit 0'
TimeoutStartSec=420
RestartSec=15
