# OMNITECH 2026-11-11 : le controle "firewall" de omni-drift-check appelle `nft list ruleset`, impossible sans
# CAP_NET_ADMIN ni socket netlink -> faux ecart "ports absents de nft" (22, 5044, ...). Lecture seule du jeu de regles.
# Retour : supprimer ce fichier puis systemctl daemon-reload.
