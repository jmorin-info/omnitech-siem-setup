# Repointage vers le dépôt canonique (plan de cohérence du 21/11/2026, étape 3).
# L'unité de base reste identique à la production ; ce drop-in remplace l'emplacement
# du code et limite les écritures au dossier de preuves. Retour arrière :
# omni-deploy.py rollback <transaction> --apply.
# hardening.conf est lu APRÈS ce fichier (ordre alphabétique) et ajoute ses propres
# ReadWritePaths : il porte donc la même liste (27-harden-services.sh).
[Service]
WorkingDirectory=/opt/omni-siem/repository
ExecStart=
ExecStart=/bin/bash /opt/omni-siem/repository/68-iso-evidence.sh
ReadWritePaths=
ReadWritePaths=/var/lib /opt/omni-siem/repository/docs/archives/preuves-iso
