# Durcissement systemd (02/07/2026, audit). omni-soar ne lit rien dans /root
# (code /usr/local/sbin, ecrit /var/lib/omni-soar + /var/www/siem-kit/soar) donc
# ProtectHome=true (plus strict que mobile-api). Recoit les webhooks Graylog en
# loopback 8088 ; aucune capability necessaire.
[Service]
NoNewPrivileges=true
CapabilityBoundingSet=
AmbientCapabilities=
SupplementaryGroups=www-data
ProtectSystem=strict
ProtectHome=true
ReadWritePaths=/var/lib/omni-soar /var/www/siem-kit/soar
PrivateTmp=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
