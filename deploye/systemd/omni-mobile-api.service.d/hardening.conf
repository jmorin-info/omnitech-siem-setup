# Durcissement systemd (02/07/2026, audit) - neutralise l'essentiel du pouvoir
# de root en cas de RCE. User reste root car le code vit dans /root ; passage a
# un compte dedie = deplacer le code (chantier separe). ProtectHome=read-only :
# le service LIT son code, son venv et oms_graph dans /root mais ne peut rien y
# ecrire. Ecrit uniquement dans /var/lib/omni-mobile.
[Service]
NoNewPrivileges=true
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/var/lib/omni-mobile
PrivateTmp=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
