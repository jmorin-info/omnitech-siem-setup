# Repointage vers le dépôt canonique (plan de cohérence du 21/11/2026, étape 3).
# L'unité de base reste identique à la production ; ce drop-in remplace l'emplacement
# du code. Retour arrière : omni-deploy.py rollback <transaction> --apply.
[Service]
WorkingDirectory=/opt/omni-siem/repository/oms-graph
ExecStart=
ExecStart=/opt/omni-siem/repository/oms-graph/.venv/bin/python -m oms_graph.run analyze --push --config /etc/oms-graph/config.yaml
