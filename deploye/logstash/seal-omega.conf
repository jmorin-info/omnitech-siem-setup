# ============================================================================
# seal-omega.conf — Collecte du 2e SEAL : BX-SEAL-OMEGA (10.33.140.1) — PROD
# OMNITECH SECURITY · MISSION_SEAL_GRAYLOG · multi-site
# ----------------------------------------------------------------------------
# Ce fichier n'ajoute QUE les 3 inputs JDBC du site OMEGA. Logstash fusionne
# tous les fichiers de /etc/logstash/conf.d/ en UN pipeline : le filter{} et
# l'output{} de seal.conf s'appliquent donc aussi a ces inputs (NE PAS les
# redefinir ici, sinon double traitement / doublons).
#
# PREREQUIS avant de deployer ce fichier + redemarrer logstash :
#   1. PRODUCTION : DDL applique sur BX-SEAL-OMEGA (vues + rowversion) DANS UNE
#      FENETRE DE MAINTENANCE, avec accord RSSI (l'ALTER rowversion sur
#      dbo.EVENEMENTS reecrit la table). Garde-fou QA du DDL a lever sciemment.
#      -> voir seal/docs/ADD-SEAL-OMEGA.md.
#   2. Cle keystore : SEAL2_DB_SVC_USER / SEAL2_DB_SVC_PWD (compte de service
#      DEDIE a ce serveur, lecture seule sur les vues).
#   3. CA racine OMNITECH deja dans le truststore JDK (partagee) -> OK.
#   4. Route SIEM(10.33.220.10) -> 10.33.140.1:1433 : OUVERTE (verifie).
#   5. Amorcer les 3 watermarks .omega_*_last_run (valeur courante = pas de
#      backfill, ou 0 = backfill complet ; cf runbook).
#
# Le champ seal_site=bx-seal-omega distingue ce site ; les streams, pipelines,
# dashboards et detections SEAL existants couvrent les DEUX sites sans changement.
# ============================================================================

input {
  jdbc {
    id => "seal-omega-events"
    jdbc_driver_library => "/opt/mssql-jdbc/mssql-jdbc.jar"
    jdbc_driver_class => "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    jdbc_connection_string => "jdbc:sqlserver://10.33.140.1:1433;databaseName=SEAL;encrypt=true;trustServerCertificate=false;hostNameInCertificate=bx-seal-omega.omnitech.security;loginTimeout=15"
    jdbc_user => "${SEAL2_DB_SVC_USER}"
    jdbc_password => "${SEAL2_DB_SVC_PWD}"
    jdbc_default_timezone => "UTC"
    jdbc_fetch_size => 10000
    lowercase_column_names => false
    statement_filepath => "/etc/logstash/sql/events.sql"
    schedule => "*/30 * * * * *"
    use_column_value => true
    tracking_column => "WatermarkBig"
    tracking_column_type => "numeric"
    record_last_run => true
    clean_run => false
    last_run_metadata_path => "/var/lib/logstash/seal/.omega_events_last_run"
    tags => ["source_app=seal-access", "event_domain=access"]
    add_field => { "seal_site" => "bx-seal-omega" }
  }

  jdbc {
    id => "seal-omega-alarms"
    jdbc_driver_library => "/opt/mssql-jdbc/mssql-jdbc.jar"
    jdbc_driver_class => "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    jdbc_connection_string => "jdbc:sqlserver://10.33.140.1:1433;databaseName=SEAL;encrypt=true;trustServerCertificate=false;hostNameInCertificate=bx-seal-omega.omnitech.security;loginTimeout=15"
    jdbc_user => "${SEAL2_DB_SVC_USER}"
    jdbc_password => "${SEAL2_DB_SVC_PWD}"
    jdbc_default_timezone => "UTC"
    jdbc_fetch_size => 10000
    lowercase_column_names => false
    statement_filepath => "/etc/logstash/sql/alarms.sql"
    schedule => "*/30 * * * * *"
    use_column_value => true
    tracking_column => "WatermarkBig"
    tracking_column_type => "numeric"
    record_last_run => true
    clean_run => false
    last_run_metadata_path => "/var/lib/logstash/seal/.omega_alarms_last_run"
    tags => ["source_app=seal-access", "event_domain=alarm"]
    add_field => { "seal_site" => "bx-seal-omega" }
  }

  jdbc {
    id => "seal-omega-audit"
    jdbc_driver_library => "/opt/mssql-jdbc/mssql-jdbc.jar"
    jdbc_driver_class => "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    jdbc_connection_string => "jdbc:sqlserver://10.33.140.1:1433;databaseName=SEAL;encrypt=true;trustServerCertificate=false;hostNameInCertificate=bx-seal-omega.omnitech.security;loginTimeout=15"
    jdbc_user => "${SEAL2_DB_SVC_USER}"
    jdbc_password => "${SEAL2_DB_SVC_PWD}"
    jdbc_default_timezone => "UTC"
    jdbc_fetch_size => 10000
    lowercase_column_names => false
    statement_filepath => "/etc/logstash/sql/audit.sql"
    schedule => "*/30 * * * * *"
    use_column_value => true
    tracking_column => "WatermarkBig"
    tracking_column_type => "numeric"
    record_last_run => true
    clean_run => false
    last_run_metadata_path => "/var/lib/logstash/seal/.omega_audit_last_run"
    tags => ["source_app=seal-access", "event_domain=hypervisor_audit"]
    add_field => { "seal_site" => "bx-seal-omega" }
  }
}
