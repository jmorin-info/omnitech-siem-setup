name: Distribution packages
on:
  pull_request:
    paths:
      - 'distribution/**'
      - 'tools/build-release.py'
      - 'tools/install-linux-agent.py'
      - 'tests/test_distribution.py'
      - '.github/workflows/distribution.yml'
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm rsyslog
          python -m pip install pytest
      - name: Distribution failure and preservation tests
        run: python -m pytest tests/test_distribution.py -q
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import json, os
          version = json.load(open('distribution/version.json'))['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag differs from the declared release version'
          PY
      - name: Build full project artifacts
        run: python tools/build-release.py --output "$RUNNER_TEMP/packages"
      - name: Native package installation and preservation
        run: |
          cd "$RUNNER_TEMP/packages"
          sha256sum --check SHA256SUMS
          sudo apt-get install -y ./omni-siem_*.deb
          omni-siem version
          omni-siem catalogue > "$RUNNER_TEMP/catalogue.json"
          test ! -e /etc/graylog/server/server.conf
          test ! -e /opt/omni-siem/repository
          sudo omni-siem init --apply
          sudo sh -c 'printf "\n# package-upgrade-preservation\n" >> /opt/omni-siem/repository/00-vars.env'
          sudo sha256sum /opt/omni-siem/repository/00-vars.env > "$RUNNER_TEMP/config-before.sha256"
          sudo apt-get install --reinstall -y ./omni-siem_*.deb
          sudo sha256sum --check "$RUNNER_TEMP/config-before.sha256"
          sudo omni-siem status
          sudo omni-siem install --plan > "$RUNNER_TEMP/install-plan.json"
          python - <<'PY'
          import json, os
          plan = json.load(open(os.environ['RUNNER_TEMP'] + '/install-plan.json'))
          assert plan['blockers'], 'Example config must never launch a real installation'
          assert plan['database_policy'].startswith('fresh install only')
          PY
          sudo apt-get remove -y omni-siem
          sudo sha256sum --check "$RUNNER_TEMP/config-before.sha256"
      - name: Verify RPM metadata and absence of scriptlets
        run: |
          rpm -qip "$RUNNER_TEMP"/packages/*.rpm
          test -z "$(rpm -qp --scripts "$RUNNER_TEMP"/packages/*.rpm)"
      - uses: actions/upload-artifact@v4
        with:
          name: omni-siem-distribution
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: omni-siem-distribution
          path: packages
      - name: Publish release candidate as draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" packages/* --verify-tag --draft --prerelease --title "OMNI SIEM $RELEASE_TAG" --notes-file distribution/RELEASE-NOTES.md
