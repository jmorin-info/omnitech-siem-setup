name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y nginx-light
      - run: bash run-tests.sh
      - run: python tools/audit-portability.py > audit-portability.json
      - uses: actions/upload-artifact@v4
        with:
          name: portability-inventory
          path: audit-portability.json
