name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y nginx-light jq
      - run: bash run-tests.sh
      - run: python tools/audit-portability.py > audit-portability.json
      - uses: actions/upload-artifact@v4
        with:
          name: portability-inventory
          path: audit-portability.json
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lint.txt
      # ShellCheck (niveau warning, exclusions justifiées dans .shellcheckrc et
      # tools/shellcheck-baseline.txt) et Ruff (erreurs bloquantes, ruff.toml).
      - run: bash tools/ci-lint.sh
  secrets-and-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Secrets dans les fichiers suivis
        run: bash scan-depot.sh --arbre
      - name: Mentions d'outillage dans les messages de commit de la poussée
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags --depth=50 origin "${{ github.ref }}"
          for c in $(git rev-list --max-count=50 HEAD); do
            git log -1 --format=%B "$c" > /tmp/message
            bash scan-depot.sh --message /tmp/message || { echo "commit $c"; exit 1; }
          done
      - name: Manifeste des composants déployés
        run: python tools/check-manifest.py
      - name: Plan de déploiement complet en racine factice
        run: |
          # SEAL SLA est installé séparément sur l'instance de référence.
          # Simuler uniquement sa présence dans la racine de test ; aucun service lancé.
          install -Dm755 /dev/null "$RUNNER_TEMP/racine/opt/oms-seal-sla/.venv/bin/python"
          python tools/omni-deploy.py --root "$RUNNER_TEMP/racine" --home "$PWD" deploy all
