    # BEGIN OMNI V5 REPONSE (chantier 5 SIEM v5, 27/11/2026 - service en SIMULATION, cookie oms_session Path=/m)
    location /m/reponse/ {
        limit_req zone=omni_api burst=20 nodelay;
        client_max_body_size 16k;
        proxy_set_header X-Real-IP $remote_addr;
