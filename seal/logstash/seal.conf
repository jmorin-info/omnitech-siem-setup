# ============================================================================
# seal.conf — Ingestion SEAL (SQL Server QA) -> Graylog GELF
# OMNITECH SECURITY · MISSION_SEAL_GRAYLOG · Couche Logstash
# ----------------------------------------------------------------------------
# PERIMETRE QA UNIQUEMENT. Logstash n'est PAS installe sur la VM SIEM :
#   ce fichier est LIVRE PRET, non execute. Test avant deploiement :
#     bin/logstash --config.test_and_exit -f seal.conf
#
# SECURITE / TLS (CONTRACT D0) :
#   - IP epinglee 10.33.120.2,1433 (double enregistrement DNS ecarte, cf RECON 5.5)
#   - encrypt=true;trustServerCertificate=false;hostNameInCertificate=<FQDN>
#     => chiffrement + validation stricte de la chaine et du SAN.
#   - AUCUN secret en clair : identifiants lus depuis le logstash-keystore
#     (${SEAL_DB_SVC_USER} / ${SEAL_DB_SVC_PWD}), cf keystore-setup.sh.
#
# WATERMARK (CONTRACT D5) :
#   - record_last_run + use_column_value sur la colonne WatermarkBig
#     (CONVERT(BIGINT, rowversion)), clean_run=false, tracking numerique.
#   - last_run_metadata_path DISTINCT par input (3 curseurs independants).
#   - jdbc_default_timezone=UTC : :sql_last_value et les horodatages sont
#     interpretes en UTC (les vues fournissent deja timestamp en UTC, cf D0).
#
# *** SEED INITIAL (PREMIERE EXECUTION) ***
#   Aucun rapatriement d'historique (CONTRACT D5). Avant le tout premier
#   demarrage, amorcer chaque curseur a la valeur COURANTE du rowversion, p.ex.
#   recuperer  SELECT CONVERT(BIGINT, MIN_ACTIVE_ROWVERSION())  cote SQL, puis
#   ecrire cette valeur dans chacun des 3 fichiers last_run_metadata_path :
#     --- 3.0
#     <valeur_bigint>
#   (format Logstash pour un tracking numerique). A defaut de seed, la clause
#   WHERE WatermarkBig > 0 rejouerait tout le stock au premier tick.
# ============================================================================

input {
  # -- Flux ACCES (dbo.EVENEMENTS via vue) ---------------------------------
  jdbc {
    id => "seal-jdbc-events"
    jdbc_driver_library => "/opt/mssql-jdbc/mssql-jdbc.jar"
    jdbc_driver_class => "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    jdbc_connection_string => "jdbc:sqlserver://10.33.120.2:1433;databaseName=SEAL;encrypt=true;trustServerCertificate=false;hostNameInCertificate=bx-qa-seal-vm.omnitech.security;loginTimeout=15"
    jdbc_user => "${SEAL_DB_SVC_USER}"
    jdbc_password => "${SEAL_DB_SVC_PWD}"
    jdbc_default_timezone => "UTC"
    jdbc_fetch_size => 10000   # streame les gros lots (backfill ~1,6M) sans OOM
    lowercase_column_names => false
    statement_filepath => "/etc/logstash/sql/events.sql"
    schedule => "*/30 * * * * *"
    use_column_value => true
    tracking_column => "WatermarkBig"
    tracking_column_type => "numeric"
    record_last_run => true
    clean_run => false
    last_run_metadata_path => "/var/lib/logstash/seal/.seal_events_last_run"
    # event_source / event_domain sont fournis par la VUE (colonnes) : NE PAS
    # les re-poser ici (add_field ferait un tableau ["access","access"] qui casse
    # le routage de stream et les pipelines). Les tags restent pour le filtre.
    tags => ["source_app=seal-access", "event_domain=access"]
    add_field => { "seal_site" => "bx-qa-seal-vm" }
  }

  # -- Flux ALARMES (dbo.ALARMES via vue) ----------------------------------
  jdbc {
    id => "seal-jdbc-alarms"
    jdbc_driver_library => "/opt/mssql-jdbc/mssql-jdbc.jar"
    jdbc_driver_class => "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    jdbc_connection_string => "jdbc:sqlserver://10.33.120.2:1433;databaseName=SEAL;encrypt=true;trustServerCertificate=false;hostNameInCertificate=bx-qa-seal-vm.omnitech.security;loginTimeout=15"
    jdbc_user => "${SEAL_DB_SVC_USER}"
    jdbc_password => "${SEAL_DB_SVC_PWD}"
    jdbc_default_timezone => "UTC"
    jdbc_fetch_size => 10000   # streame les gros lots (backfill ~1,6M) sans OOM
    lowercase_column_names => false
    statement_filepath => "/etc/logstash/sql/alarms.sql"
    schedule => "*/30 * * * * *"
    use_column_value => true
    tracking_column => "WatermarkBig"
    tracking_column_type => "numeric"
    record_last_run => true
    clean_run => false
    last_run_metadata_path => "/var/lib/logstash/seal/.seal_alarms_last_run"
    tags => ["source_app=seal-access", "event_domain=alarm"]
    add_field => { "seal_site" => "bx-qa-seal-vm" }
  }

  # -- Flux AUDIT (Audit.* UNION ALL via vue) ------------------------------
  jdbc {
    id => "seal-jdbc-audit"
    jdbc_driver_library => "/opt/mssql-jdbc/mssql-jdbc.jar"
    jdbc_driver_class => "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    jdbc_connection_string => "jdbc:sqlserver://10.33.120.2:1433;databaseName=SEAL;encrypt=true;trustServerCertificate=false;hostNameInCertificate=bx-qa-seal-vm.omnitech.security;loginTimeout=15"
    jdbc_user => "${SEAL_DB_SVC_USER}"
    jdbc_password => "${SEAL_DB_SVC_PWD}"
    jdbc_default_timezone => "UTC"
    jdbc_fetch_size => 10000   # streame les gros lots (backfill ~1,6M) sans OOM
    lowercase_column_names => false
    statement_filepath => "/etc/logstash/sql/audit.sql"
    schedule => "*/30 * * * * *"
    use_column_value => true
    tracking_column => "WatermarkBig"
    tracking_column_type => "numeric"
    record_last_run => true
    clean_run => false
    last_run_metadata_path => "/var/lib/logstash/seal/.seal_audit_last_run"
    tags => ["source_app=seal-access", "event_domain=hypervisor_audit"]
    add_field => { "seal_site" => "bx-qa-seal-vm" }
  }
}

filter {
  # Flux audit : le JSON residuel (FOR JSON PATH cote vue) est eclate en champs
  # seal_<clef> (target=>"seal") POUR les colonnes specifiques (Login/IpAddress/
  # ObjectId/Number/Status/MasterKeys...). On CONSERVE aussi le JSON brut dans
  # seal_payload (rename, PAS remove) : reference + repli detection.
  if "event_domain=hypervisor_audit" in [tags] {
    json {
      source => "PayloadJson"
      target => "seal"
      skip_on_invalid_json => true
    }
    mutate { rename => { "PayloadJson" => "seal_payload" } }
  }

  # Heure METIER -> @timestamp. Le champ `timestamp` fourni par les vues
  # (datetime2) arrive en OBJET Logstash::Timestamp (deja UTC via
  # jdbc_default_timezone), PAS en chaine -> le filtre `date` echouait
  # (_seal_dateparsefailure -> @timestamp = heure d'ingestion, tout "maintenant").
  # On le COPIE directement dans @timestamp. Si null (EVEN_DATEHEURE absent sur
  # de rares evenements), @timestamp reste l'heure de reception (repli acceptable).
  ruby {
    code => 'ts = event.get("timestamp"); event.set("@timestamp", ts) unless ts.nil?'
  }

  # short_message GELF (Graylog l'exige non vide) + nettoyage des champs
  # redondants (timestamp brut = deja porte par @timestamp ; @version interne).
  mutate {
    add_field    => { "message" => "SEAL %{event_domain}" }
    remove_field => ["@version", "timestamp"]
  }
}

output {
  # Ingest GELF UDP vers l'input DEDIE SEAL : "OMNI - SEAL (GELF UDP 12202)".
  # PIEGE (corrige) : l'output `gelf` parle GELF/UDP -> il NE PEUT PAS viser un
  # input GELF HTTP (12201). Un input GELF UDP dedie isole proprement la source
  # SEAL (attribution/audit) ; le routage vers les 3 streams SEAL se fait par
  # event_source/event_domain (cf provision_seal.py). Chunking GELF automatique.
  gelf {
    host     => "127.0.0.1"      # destination : Graylog local
    port     => 12202            # input GELF TCP dedie SEAL
    protocol => "TCP"            # TCP : livraison fiable (bulk/backfill, pas de perte
                                 # UDP, pas de limite de taille sur les payloads audit)
    sender   => "bx-qa-seal-vm"  # host GELF (source) = la VM SEAL
  }
}
