# ==============================================================================
# winlogbeat.yml - Configuration de reference des postes et serveurs Windows
# Source unique : publiee sous /kit/ par 95-kit-deploy.sh, qui remplace les
# marqueurs __SIEM_FQDN__, __SITE_NAME__ et __BEATS_CA_FILE__ par les valeurs
# de 00-vars.env. Ne pas copier ce fichier a la main sur les postes : un second
# circuit (GPO, autre RMM) qui ecrit une version differente provoque un
# redemarrage de Winlogbeat a chaque passage de l'un ou de l'autre.
# Controle hors ligne : tests/test_endpoint_kit.py (marqueurs, YAML, plages).
# ==============================================================================

winlogbeat.event_logs:

  # --- Securite : on ne prend que les EventID utiles a la detection ----------
  - name: Security
    # PLAGES obligatoires (pas une longue liste) : l'API Windows Event Log limite
    # le nombre d'expressions par requete ; au-dela -> "requete invalide" et le
    # canal Security n'est plus lu du tout. Ne jamais depasser 22 conditions
    # (une plage compte pour deux) : controle par tests/test_endpoint_kit.py.
    #   1100-1104 journal efface/arrete | 4624-4799 auth, comptes, Kerberos, DS
    #   4868-4900 AD CS (dont 4898-4900 modeles de certificats)
    #   5136-5145 changements DS + partages | 6272-6274 NPS | 7045
    event_id: 1100-1104, 4624-4799, 4868-4900, 5136-5145, 6272-6274, 7045
    ignore_older: 72h

  # --- Sysmon : tout (le filtrage se fait dans la config Sysmon elle-meme) ---
  - name: Microsoft-Windows-Sysmon/Operational
    ignore_older: 72h

  # --- PowerShell : script blocks (4104) ---------------------------------------
  - name: Microsoft-Windows-PowerShell/Operational
    event_id: 4104
    ignore_older: 72h

  # --- Defender : detections et changements d'etat ---------------------------
  - name: Microsoft-Windows-Windows Defender/Operational
    event_id: 1006, 1007, 1116, 1117, 1118, 1119, 5001, 5007, 5010, 5012
    ignore_older: 72h

  # --- System : services, crashs, arrets inattendus --------------------------
  - name: System
    event_id: 104, 1074, 6005, 6006, 6008, 7034, 7036, 7040, 7045
    ignore_older: 72h

  # --- RDP : sessions ouvertes/reconnectees (lateralisation) -----------------
  - name: Microsoft-Windows-TerminalServices-LocalSessionManager/Operational
    event_id: 21, 22, 24, 25
    ignore_older: 72h

  # --- NTLM : audit (n'emet que si la GPO d'audit NTLM est activee) ----------
  - name: Microsoft-Windows-NTLM/Operational
    event_id: 8001, 8002, 8003, 8004
    ignore_older: 72h

  # --- AppLocker : refus et « aurait ete bloque » (mode audit) seulement -------
  # Les autorisations 8002/8005/8020/8023 (environ 5 000/jour/poste) sont exclues.
  - name: Microsoft-Windows-AppLocker/EXE and DLL
    event_id: 8003, 8004
    ignore_older: 72h
  - name: Microsoft-Windows-AppLocker/MSI and Script
    event_id: 8006, 8007
    ignore_older: 72h
  - name: Microsoft-Windows-AppLocker/Packaged app-Execution
    event_id: 8021, 8022
    ignore_older: 72h
  - name: Microsoft-Windows-AppLocker/Packaged app-Deployment
    event_id: 8024, 8025
    ignore_older: 72h

  # --- Certificats : journal dedie alimente par Get-OmniCertExpiry.ps1 -------
  # (n'existe que sur les machines ou le script tourne : PKI + serveurs ; les
  #  autres l'ignorent sans erreur. EventID 9001 = cert proche d'expiration)
  - name: OMNI-Certificats
    ignore_older: 72h

  # --- Inventaire : logiciels + OS/correctifs (Get-OmniInventory.ps1) --------
  # EventID 9101 = logiciel, 9102 = OS/correctifs. Parse par le pipeline
  # (event_source=inventory) -> detection de vulnerabilites KEV + anciennete patch.
  - name: OMNI-Inventaire
    ignore_older: 26h

  # --- DNS Server : audit (changements de config DNS, faible volume, A.8.9) ----
  # Les requetes DNS (canal analytique) ne sont PAS lisibles par Winlogbeat :
  # elles passent par une collecte ETW dediee (NXLog im_etw -> GELF).
  - name: Microsoft-Windows-DNSServer/Audit
    ignore_older: 72h

  # --- Directory Service (DC seulement) : LDAP non signe, CBT, replication -----
  # Absent hors DC : Winlogbeat l'ignore (avertissement « channel not found »).
  - name: Directory Service
    event_id: 1311, 1388, 1925, 1988, 2042, 2087, 2088, 2886-2889, 3039-3041, 3074-3075
    ignore_older: 72h

# ------------------------------------------------------------------------------
output.logstash:                       # l'input "Beats" de Graylog parle logstash
  hosts: ["__SIEM_FQDN__:5044"]
  ssl.enabled: true
  ssl.verification_mode: full
  ssl.certificate_authorities: ["C:/Program Files/Winlogbeat/__BEATS_CA_FILE__"]
  bulk_max_size: 2048
  compression_level: 3

# Tags utiles au routage des streams cote Graylog
processors:
  - add_fields:
      target: omnitech
      fields:
        site: "__SITE_NAME__"
        collecteur: "winlogbeat"

logging.level: warning
logging.to_files: true
logging.files:
  path: C:/ProgramData/winlogbeat/logs
  keepfiles: 3
